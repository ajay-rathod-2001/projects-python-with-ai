version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hireai-postgres
    restart: always
    environment:
      POSTGRES_USER: hireai_user
      POSTGRES_PASSWORD: hireai_secure_password
      POSTGRES_DB: hireai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireai_user -d hireai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hireai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireai-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://hireai_user:hireai_secure_password@db:5432/hireai_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=hireai-production-jwt-secret-key-change-me
      - DOCKER_SANDBOX_ENABLED=true
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hireai-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
